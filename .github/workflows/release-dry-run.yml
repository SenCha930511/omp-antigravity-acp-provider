name: Release dry run

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to verify without publishing
        required: true
        type: string
      verify_marketplace:
        description: Verify marketplace installation against an already-published tag
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-dry-run-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  verify:
    name: release-verify
    uses: ./.github/workflows/release-verify.yml
    with:
      tag: ${{ inputs.tag }}
      artifact_name: npm-tarball-dry-run
      verify_marketplace: ${{ inputs.verify_marketplace }}
    permissions:
      contents: read
