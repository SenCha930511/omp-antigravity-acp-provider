name: Release verify

on:
  workflow_call:
    inputs:
      tag:
        description: Existing v* tag to verify
        required: true
        type: string
      artifact_name:
        description: Artifact name for the packed tarball
        required: false
        default: npm-tarball
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: release-verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Verify the exact release tag and metadata
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if ! git rev-parse --verify --quiet "refs/tags/$TAG^{commit}" >/dev/null; then
            git fetch --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
          fi
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$TAG^{commit}")"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          node scripts/check-release-versions.mjs --release --tag "$TAG" --notes-output "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md"

      - name: Install dependencies
        run: npm ci

      - name: Prepare isolated home
        run: mkdir -p "$RUNNER_TEMP/omp-home"

      - name: Run offline verification
        env:
          HOME: ${{ runner.temp }}/omp-home
          USERPROFILE: ${{ runner.temp }}/omp-home
        run: npm run check

      - name: Run marketplace verification
        env:
          HOME: ${{ runner.temp }}/omp-home
          USERPROFILE: ${{ runner.temp }}/omp-home
        run: npm run test:marketplace

      - name: Set the release commit as gitHead
        run: npm pkg set gitHead="$(git rev-parse HEAD)"

      - name: Pack the exact release artifact
        run: |
          set -euo pipefail
          mkdir -p dist
          npm pack --ignore-scripts --pack-destination dist

      - name: Verify the packed tarball
        env:
          TAG: ${{ inputs.tag }}
          HOME: ${{ runner.temp }}/omp-home
          USERPROFILE: ${{ runner.temp }}/omp-home
        run: node scripts/verify-release-tarball.mjs --directory dist --tag "$TAG" --head "$(git rev-parse HEAD)" --test-packed

      - name: Upload the release tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact_name }}
          path: dist/*.tgz
          if-no-files-found: error
          retention-days: 30
