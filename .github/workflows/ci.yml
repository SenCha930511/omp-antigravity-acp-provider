name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare isolated home
        run: |
          mkdir -p "$RUNNER_TEMP/omp-home"
          echo "HOME=$RUNNER_TEMP/omp-home" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.19.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install CI tools
        run: |
          npm install --global npm@11.21.2
          npm install --prefix "$RUNNER_TEMP/omp" --no-save --no-audit --no-fund @oh-my-pi/pi-coding-agent@18.19.0
          echo "$RUNNER_TEMP/omp/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Verify tool versions
        run: |
          printf '%s\n' "node $(node --version)" "npm $(npm --version)" "bun $(bun --version)" "$(omp --version)"
          test "$(node --version)" = "v22.19.0"
          test "$(npm --version)" = "11.21.2"
          test "$(bun --version)" = "1.4.4"
          test "$(omp --version)" = "omp/18.19.0"

      - name: Install dependencies
        run: npm ci

      - name: Run offline verification
        run: npm run check

      - name: Check release version consistency
        run: |
          npm run check:versions
          node --test scripts/test-check-release-versions.mjs
          node --test scripts/test-bump-release.mjs
