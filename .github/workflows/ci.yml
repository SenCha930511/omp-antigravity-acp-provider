name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        # Fast feedback only. The trusted gate is the PR title workflow on pull_request_target.
        run: |
          node -e '
            const title = process.env.PR_TITLE ?? "";
            const pattern = /^(?:feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(?:\([a-z0-9._/-]+\))?: \S.*$/;
            if (!pattern.test(title) || title.endsWith(".")) {
              console.error(`Invalid PR title: ${JSON.stringify(title)}`);
              console.error("Expected: <type>: <summary> (lowercase conventional prefix, no trailing period)");
              process.exit(1);
            }
          '

      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Install dependencies
        run: npm ci

      - name: Prepare isolated home
        run: mkdir -p "$RUNNER_TEMP/omp-home"

      - name: Run offline verification
        env:
          HOME: ${{ runner.temp }}/omp-home
          USERPROFILE: ${{ runner.temp }}/omp-home
        run: npm run check

  portability:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - windows-2025
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Install dependencies
        shell: bash
        run: npm ci

      - name: Prepare isolated home
        shell: bash
        run: mkdir -p "$RUNNER_TEMP/omp-home"

      - name: Run full macOS verification
        if: runner.os == 'macOS'
        shell: bash
        env:
          HOME: ${{ runner.temp }}/omp-home
          USERPROFILE: ${{ runner.temp }}/omp-home
        run: npm run check

      - name: Run cross-platform verification
        if: runner.os != 'macOS'
        shell: bash
        env:
          HOME: ${{ runner.temp }}/omp-home
          USERPROFILE: ${{ runner.temp }}/omp-home
        run: npm run check:portable
