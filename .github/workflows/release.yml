name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: release-verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Verify the exact release tag and metadata
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = "tag"
          test "$GITHUB_REF" = "refs/tags/$TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$TAG^{commit}")"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          node scripts/check-release-versions.mjs --release --tag "$TAG" --notes-output "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md"

      - name: Install dependencies
        run: npm ci

      - name: Prepare isolated home
        run: mkdir -p "$RUNNER_TEMP/omp-home"

      - name: Run offline verification
        env:
          HOME: ${{ runner.temp }}/omp-home
          USERPROFILE: ${{ runner.temp }}/omp-home
        run: npm run check

      - name: Set the release commit as gitHead
        run: npm pkg set gitHead="$(git rev-parse HEAD)"

      - name: Pack the exact release artifact
        run: |
          set -euo pipefail
          mkdir -p dist
          npm pack --ignore-scripts --pack-destination dist

      - name: Verify the packed tarball
        env:
          TAG: ${{ github.ref_name }}
          HOME: ${{ runner.temp }}/omp-home
          USERPROFILE: ${{ runner.temp }}/omp-home
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -type f -name '*.tgz' | wc -l)" -eq 1
          TARBALL=$(find dist -maxdepth 1 -type f -name '*.tgz')
          NAME=$(tar -xOf "$TARBALL" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).name')
          VERSION=$(tar -xOf "$TARBALL" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')
          GIT_HEAD=$(tar -xOf "$TARBALL" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).gitHead')
          test "$NAME" = "omp-antigravity-acp-provider"
          test "v$VERSION" = "$TAG"
          test "$GIT_HEAD" = "$(git rev-parse HEAD)"
          node scripts/test-packed.mjs --tarball "$TARBALL"
          echo "Packed and verified $NAME@$VERSION from $GIT_HEAD"
      - name: Upload the release tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-tarball
          path: dist/*.tgz
          if-no-files-found: error
          retention-days: 30

  publish:
    name: publish
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    concurrency:
      group: release-publish
      cancel-in-progress: false
      queue: max
    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/omp-antigravity-acp-provider
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.19.0

      - name: Set up npm
        uses: ./.github/actions/setup-npm

      - name: Download the release tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarball
          path: dist

      - name: Verify the downloaded tarball
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = "tag"
          test "$GITHUB_REF" = "refs/tags/$TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$TAG^{commit}")"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          test "$(find dist -maxdepth 1 -type f -name '*.tgz' | wc -l)" -eq 1
          TARBALL=$(find dist -maxdepth 1 -type f -name '*.tgz')
          NAME=$(tar -xOf "$TARBALL" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).name')
          VERSION=$(tar -xOf "$TARBALL" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')
          GIT_HEAD=$(tar -xOf "$TARBALL" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).gitHead')
          test "$NAME" = "omp-antigravity-acp-provider"
          test "v$VERSION" = "$TAG"
          test "$GIT_HEAD" = "$(git rev-parse HEAD)"
          {
            echo "TARBALL=$TARBALL"
            echo "NAME=$NAME"
            echo "VERSION=$VERSION"
          } >> "$GITHUB_ENV"
      - name: Publish or verify the exact tarball
        run: |
          set -euo pipefail
          LOCAL_INTEGRITY=$(node -e 'const { createHash } = require("node:crypto"); const { readFileSync } = require("node:fs"); process.stdout.write(`sha512-${createHash("sha512").update(readFileSync(process.argv[1])).digest("base64")}`)' "$TARBALL")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            PUBLISHED_INTEGRITY=$(npm view "$NAME@$VERSION" dist.integrity)
            test "$PUBLISHED_INTEGRITY" = "$LOCAL_INTEGRITY"
            echo "$NAME@$VERSION is already published with the same integrity; skipping publish."
            exit 0
          fi
          DIST_TAG=latest
          LATEST=$(npm view "$NAME" dist-tags.latest)
          if [ -n "$LATEST" ] && [ "$(printf '%s\n%s\n' "$LATEST" "$VERSION" | sort -V | tail -1)" != "$VERSION" ]; then
            DIST_TAG=backfill
            echo "$NAME@$VERSION is older than the current latest $LATEST; publishing under the backfill dist-tag."
          fi
          npm publish "./$TARBALL" --access public --provenance --tag "$DIST_TAG"

  github-release:
    name: github-release
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Install dependencies
        run: npm ci

      - name: Download the release tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarball
          path: dist

      - name: Verify the downloaded tarball and extract release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = "tag"
          test "$GITHUB_REF" = "refs/tags/$TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$TAG^{commit}")"
          test "$(find dist -maxdepth 1 -type f -name '*.tgz' | wc -l)" -eq 1
          TARBALL=$(find dist -maxdepth 1 -type f -name '*.tgz')
          NAME=$(tar -xOf "$TARBALL" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).name')
          VERSION=$(tar -xOf "$TARBALL" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')
          GIT_HEAD=$(tar -xOf "$TARBALL" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).gitHead')
          test "$NAME" = "omp-antigravity-acp-provider"
          test "v$VERSION" = "$TAG"
          test "$GIT_HEAD" = "$(git rev-parse HEAD)"
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          node scripts/check-release-versions.mjs --release --tag "$TAG" --notes-output "$NOTES_FILE"
          test -s "$NOTES_FILE"
          {
            echo "TARBALL=$TARBALL"
            echo "NAME=$NAME"
            echo "VERSION=$VERSION"
            echo "NOTES_FILE=$NOTES_FILE"
          } >> "$GITHUB_ENV"

      - name: Verify published registry integrity
        env:
          HOME: ${{ runner.temp }}/omp-home
          USERPROFILE: ${{ runner.temp }}/omp-home
        run: |
          set -euo pipefail
          mkdir -p "$HOME"
          LOCAL_INTEGRITY=$(node -e 'const { createHash } = require("node:crypto"); const { readFileSync } = require("node:fs"); process.stdout.write(`sha512-${createHash("sha512").update(readFileSync(process.argv[1])).digest("base64")}`)' "$TARBALL")
          PUBLISHED_INTEGRITY=""
          for attempt in $(seq 1 24); do
            PUBLISHED_INTEGRITY=$(npm view "$NAME@$VERSION" dist.integrity 2>/dev/null || true)
            if [ "$PUBLISHED_INTEGRITY" = "$LOCAL_INTEGRITY" ]; then
              break
            fi
            sleep 5
          done
          test "$PUBLISHED_INTEGRITY" = "$LOCAL_INTEGRITY"

      - name: Create or reuse the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          LATEST=$(npm view "$NAME" dist-tags.latest)
          RELEASE_ARGS=(--title "$TAG" --notes-file "$NOTES_FILE")
          if [ "$LATEST" != "$VERSION" ]; then
            RELEASE_ARGS+=(--latest=false)
            echo "$NAME@$VERSION is not the latest npm version; the GitHub release will not replace Latest."
          fi
          LOOKUP=$(gh api --include "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" 2>/dev/null || true)
          STATUS=$(printf '%s\n' "$LOOKUP" | sed -n '1s/^HTTP\/[^ ]* \([0-9]*\).*/\1/p')
          case "$STATUS" in
            200)
              gh release upload "$TAG" "$TARBALL" --clobber --repo "$GITHUB_REPOSITORY"
              gh release edit "$TAG" "${RELEASE_ARGS[@]}" --draft=false --prerelease=false --repo "$GITHUB_REPOSITORY"
              echo "Reused the existing GitHub release $TAG with the exact release tarball and changelog notes."
              ;;
            404)
              gh release create "$TAG" "$TARBALL" --verify-tag "${RELEASE_ARGS[@]}" --repo "$GITHUB_REPOSITORY"
              ;;
            *)
              echo "GitHub release lookup failed with HTTP status ${STATUS:-unknown}." >&2
              exit 1
              ;;
          esac

      - name: Verify marketplace installation
        env:
          HOME: ${{ runner.temp }}/omp-home
          USERPROFILE: ${{ runner.temp }}/omp-home
        run: |
          set -euo pipefail
          mkdir -p "$HOME"
          npm run test:marketplace
